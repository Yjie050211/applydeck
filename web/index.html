<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<meta name="theme-color" content="#f3f3f3" />
<title>投递舱 ApplyDeck</title>
<script>
// 首屏防闪白：在样式生效前就确定明暗
(function () {
  try {
    var mode = localStorage.getItem('applydeck-theme') || 'system';
    var dark = mode === 'dark' || (mode === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    var root = document.documentElement;
    root.setAttribute('data-theme', dark ? 'dark' : 'light');
    root.style.colorScheme = dark ? 'dark' : 'light';
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', dark ? '#202020' : '#f3f3f3');
  } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
})();
</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f6cbd'/%3E%3Cpath d='M9 12h14M9 17h9M9 22h5' stroke='%23ffffff' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<div class="app">
  <aside class="rail" id="rail"></aside>
  <main class="main">
    <header class="topbar" id="topbar"></header>
    <section class="view" id="view"><div class="loading"><div class="spinner"></div>正在加载…</div></section>
  </main>
</div>
<div id="overlay"></div>
<div class="toast" id="toast"></div>
<script type="module" src="/js/app.js"></script>
</body>
</html>
